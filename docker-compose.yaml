services:
  frontend:
    build: 
      context: ./frontend
    container_name: kofre_frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: kofre_backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      VERIFIER_URL: http://verifier:5678
    networks:
      - default
      - verifier_net
    depends_on:
      db:
        condition: service_healthy
      verifier:
        condition: service_started

  verifier:
    build:
      context: ./verifier-backend
    container_name: kofre_verifier
    environment:
      SECRET_KEY: ${VERIFIER_SECRET_KEY:?set VERIFIER_SECRET_KEY in .env}
    # No "ports": not published to the host. Only reachable by services on verifier_net.
    networks:
      - verifier_net

  db:
    image: postgres:18
    container_name: kofre_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kofredb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user", "-d", "kofredb"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - db_data:/var/lib/postgresql

networks:
  verifier_net:
    internal: true

volumes:
  db_data:
