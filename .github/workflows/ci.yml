name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: kofredb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d kofredb"
          --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.24"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Keys and CI settings
        run: |
          mkdir -p .env.d
          openssl genrsa -out .env.d/oidc.key 2048
          # settings.py points at the docker-compose host "db"; the service runs on localhost.
          cat > ci_settings.py <<'EOF'
          from kofre.settings import *  # noqa: F401,F403

          DATABASES["default"].update({"HOST": "localhost", "PORT": 5432})
          EOF
          uv run python manage.py generate_key --settings=ci_settings
      - run: uv run pytest -q --ds=ci_settings
      - name: Django deploy check (informational)
        run: uv run python manage.py check --deploy --settings=ci_settings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Integration and browser tests need a running backend.
      - run: npx vitest run --exclude 'src/test/integration/**' --exclude 'src/test/e2e/**'

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - run: docker compose -f docker-compose.security.yml build
      - run: docker compose -f docker-compose.security.yml run --rm security-scanner
      - if: always()
        run: cat security-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: security-reports/
