services:
  frontend:
    build: 
      context: ./frontend
    container_name: kofre_frontend
    environment:
      VITE_API_PROXY_TARGET: https://backend:8080
      VITE_HTTPS: "true"
      VITE_HTTPS_CERT: /certs/localhost.pem
      VITE_HTTPS_KEY: /certs/localhost-key.pem
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./backend/.certs:/certs:ro
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: kofre_backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    container_name: kofre_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kofredb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user", "-d", "kofredb"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:
