[project]
name = "kofre-backend"
version = "0.1.0"
description = "Kofre banking backend (Django port) for the Application Security course project"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "django-cors-headers>=4.7",
    "argon2-cffi>=23",
    "cryptography>=45",
    "schwifty>=2025.1",
    "psycopg>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "kofre.settings"
testpaths = ["tests"]
