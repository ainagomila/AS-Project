services:
  frontend:
    build:
      context: ./frontend
      args:
        UID: ${KOFRE_UID:-1000}
    container_name: kofre_frontend
    environment:
      VITE_API_PROXY_TARGET: https://backend:8080
      VITE_HTTPS: "true"
      VITE_HTTPS_CERT: /certs/localhost.pem
      VITE_HTTPS_KEY: /certs/localhost-key.pem
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./backend/.certs:/certs:ro
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      args:
        UID: ${KOFRE_UID:-1000}
    container_name: kofre_backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      VERIFIER_URL: http://verifier:5678
      # Generated into .env by scripts/start-docker.*
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-31536000}
    networks:
      - default
      - verifier_net
    depends_on:
      db:
        condition: service_healthy
      verifier:
        condition: service_started

  verifier:
    build:
      context: ./verifier-backend
    container_name: kofre_verifier
    environment:
      SECRET_KEY: ${VERIFIER_SECRET_KEY:?set VERIFIER_SECRET_KEY in .env}
    # No "ports": not published to the host. Only reachable by services on verifier_net.
    networks:
      - verifier_net

  db:
    image: postgres:18
    container_name: kofre_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kofredb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user", "-d", "kofredb"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - db_data:/var/lib/postgresql

networks:
  verifier_net:
    internal: true

volumes:
  db_data:
